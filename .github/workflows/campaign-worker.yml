name: Campaign worker

# Vercel's Hobby plan allows only one cron run per day, which is far too slow
# to drain a send job in batches. GitHub Actions is free on a public repo, so
# the real cadence lives here; vercel.json keeps a daily run as a safety net.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Never let two workers overlap: the job runner allows one active send job, and
# a second concurrent call would just contend for the same rows.
concurrency:
  group: campaign-worker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drain a batch
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET is not set — skipping."
            exit 0
          fi

          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
                   --max-time 120 \
                   -H "Authorization: Bearer $CRON_SECRET" \
                   "${SITE_URL%/}/api/cron/campaigns")

          echo "HTTP $code"
          cat /tmp/out.json; echo

          # 401 means the secret is wrong; fail loudly rather than silently
          # never sending. Other 5xx are transient and retried next tick.
          if [ "$code" = "401" ] || [ "$code" = "503" ]; then
            exit 1
          fi
