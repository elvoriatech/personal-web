name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # `next typegen` writes the generated route types that app code relies
        # on (LayoutProps and friends); tsc fails without them on a clean clone.
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        # No secrets needed: the database and mail layers degrade to their
        # unconfigured state, so a build never depends on production values.
        run: npm run build
